pluginManagement {
    repositories { gradlePluginPortal(); maven { url = 'https://maven.fabricmc.net/' }; maven { url = 'https://maven.minecraftforge.net' }; maven { url = 'https://maven.neoforged.net/releases' } }
}
plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0' }
rootProject.name = 'zeromods-core'
include 'neoforge-1.21.1'

include 'forge-1.21.1'

include 'fabric-1.21.1'

include 'forge-1.20.1', 'fabric-1.20.1'
