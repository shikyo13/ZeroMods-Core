plugins { id 'fabric-loom' version '1.10.5' }
group = 'com.zeromods'
version = rootProject.version
base.archivesName = 'zeromods-core-fabric-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir rootProject.file('src/main/java')
sourceSets.main.java.srcDir rootProject.file('minecraft-common/src/main/java')
dependencies {
 minecraft 'com.mojang:minecraft:1.20.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.19.5'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
jar { from(rootProject.file('LICENSE')) { into 'META-INF' } }

dependencies { modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.6+1.20.1' }

// Recipe browsers are compile-only: Core serves them when installed and never bundles them.
repositories {
 maven { url = 'https://maven.blamejared.com/'; content { includeGroup 'mezz.jei' } }
 maven { url = 'https://maven.terraformersmc.com/releases/'; content { includeGroup 'dev.emi' } }
}
dependencies {
 modCompileOnly 'mezz.jei:jei-1.20.1-fabric-api:15.20.0.129'
 modCompileOnly 'dev.emi:emi-fabric:1.1.24+1.20.1'
}

sourceSets.main.resources.srcDir rootProject.file('src/main/resources')
