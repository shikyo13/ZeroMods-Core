plugins { id 'java-library'; id 'maven-publish' }
group = 'com.zeromods'
version = '0.1.0'
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
publishing { publications { core(MavenPublication) { from components.java } } }
tasks.register('verifyCore', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.zeromods.core.CoreContractTest'
}
tasks.named('check') { dependsOn 'verifyCore' }

tasks.named('jar', Jar) { from('LICENSE') { into 'META-INF' } }
