plugins { id 'java-library'; id 'net.minecraftforge.gradle' version '6.0.54' }
group = 'com.zeromods'
version = rootProject.version
base.archivesName = 'zeromods-core-forge-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir rootProject.file('src/main/java')
minecraft { mappings channel: 'official', version: '1.21.1'; reobf = false }
dependencies { minecraft 'net.minecraftforge:forge:1.21.1-52.1.0' }
processResources { inputs.property 'version', project.version; filesMatching('META-INF/mods.toml') { expand version: project.version } }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
tasks.named('jar', Jar) { from(rootProject.file('LICENSE')) { into 'META-INF' } }

repositories { exclusiveContent {
 forRepository { maven { url = 'https://libraries.minecraft.net'; metadataSources { mavenPom(); artifact() } } }
 filter { includeGroup 'org.lwjgl' }
} }

sourceSets.main.resources.srcDir rootProject.file('src/main/resources')
