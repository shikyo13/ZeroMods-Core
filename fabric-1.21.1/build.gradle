plugins { id 'fabric-loom' version '1.10.5' }
group = 'com.zeromods'
version = rootProject.version
base.archivesName = 'zeromods-core-fabric-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir rootProject.file('src/main/java')
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.19.5'
}
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps = false; reproducibleFileOrder = true }
jar { from(rootProject.file('LICENSE')) { into 'META-INF' } }

dependencies { modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1' }

sourceSets.main.resources.srcDir rootProject.file('src/main/resources')
